<!DOCTYPE html>
<html>
<head>
  <title>Incident Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    :root{
      --bg:#f4f6f9; --card:#fff; --text:#111827; --muted:#6b7280; --border:#e5e7eb;
      --sidebar:#0b1220; --sidebarText:#e5e7eb; --sidebarMuted:#94a3b8;
      --shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    [data-theme="dark"]{
      --bg:#0b1220; --card:#111827; --text:#e5e7eb; --muted:#9ca3af; --border:#1f2937;
      --sidebar:#070c15; --sidebarText:#e5e7eb; --sidebarMuted:#9ca3af;
      --shadow: 0 12px 34px rgba(0,0,0,.35);
    }

    body{ background:var(--bg); color:var(--text); }
    .app{ display:flex; min-height:100vh; }
    .sidebar{
      width:260px; background:var(--sidebar); color:var(--sidebarText);
      padding:18px; position:sticky; top:0; height:100vh;
    }
    .brand{ font-weight:800; letter-spacing:.3px; display:flex; align-items:center; gap:10px; }
    .brand i{ font-size:20px; }
    .navlink{
      display:flex; align-items:center; gap:10px;
      padding:10px 12px; border-radius:12px; color:var(--sidebarText);
      text-decoration:none; margin-top:8px;
      transition: transform .15s ease, background .15s ease;
    }
    .navlink:hover{ background:rgba(255,255,255,.08); transform: translateX(2px); }
    .navlink small{ color:var(--sidebarMuted); }
    .content{ flex:1; padding:28px; }
    .cardx{
      background:var(--card); border:1px solid var(--border); border-radius:18px;
      box-shadow:var(--shadow); padding:22px;
      animation: fadeUp .35s ease both;
    }
    .muted{ color:var(--muted); }
    .btn{ border-radius:12px; }
    .form-select,.form-control{ border-radius:12px; background:var(--card); color:var(--text); border-color:var(--border); }
    .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .toggle{
      border:1px solid var(--border); background:var(--card); color:var(--text);
      border-radius:12px; padding:8px 12px; cursor:pointer;
      display:flex; align-items:center; gap:8px;
      transition: transform .15s ease;
    }
    .toggle:hover{ transform: translateY(-1px); }
    @keyframes fadeUp{ from{ opacity:0; transform: translateY(10px);} to{ opacity:1; transform: translateY(0);} }
  </style>
</head>

<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand mb-3">
      <i class="bi bi-shield-check"></i>
      <div>
        Incident Tracker<br>
        <small class="muted" style="color:var(--sidebarMuted)!important;">SRE-style dashboard</small>
      </div>
    </div>

    <a class="navlink" href="{{ url_for('index') }}"><i class="bi bi-speedometer2"></i> Home</a>
    <a class="navlink" href="{{ url_for('create_page') }}"><i class="bi bi-plus-circle"></i> Create</a>
    <a class="navlink" href="{{ url_for('search', operation='view') }}"><i class="bi bi-search"></i> View by ID</a>
    <a class="navlink" href="{{ url_for('search', operation='update') }}"><i class="bi bi-pencil-square"></i> Update</a>
    <a class="navlink" href="{{ url_for('search', operation='delete') }}"><i class="bi bi-trash3"></i> Delete</a>
    <a class="navlink" href="{{ url_for('list_all') }}"><i class="bi bi-list-ul"></i> List All</a>

    <div class="mt-4 p-3 rounded-4" style="background:rgba(255,255,255,.06);">
      <div class="fw-semibold"><i class="bi bi-info-circle"></i> Tip</div>
      <div class="small" style="color:var(--sidebarMuted);">
        Use SEV1 for major outages. Track status lifecycle like real on-call.
      </div>
    </div>
  </aside>

  <!-- Content -->
  <main class="content">
    <div class="topbar">
      <div>
        <h3 class="mb-0">Incident Management</h3>
        <div class="muted">Choose an operation to continue</div>
      </div>
      <button class="toggle" id="themeToggle" type="button">
        <i class="bi bi-moon-stars"></i> <span>Dark mode</span>
      </button>
    </div>

    <div class="cardx">
      <form method="POST" action="/">
        <div class="mb-3">
          <label class="form-label fw-semibold">Operation</label>
          <select name="operation" class="form-select">
            <option value="create">Create Incident</option>
            <option value="view">View Incident (by ID)</option>
            <option value="update">Update Incident (by ID)</option>
            <option value="delete">Delete Incident (by ID)</option>
          </select>
          <div class="form-text muted">This mimics common incident workflows in SRE teams.</div>
        </div>

        <button class="btn btn-primary px-4" type="submit">
          Continue <i class="bi bi-arrow-right"></i>
        </button>
      </form>
    </div>
  </main>
</div>

<script>
  // Dark mode (persists)
  const root = document.documentElement;
  const saved = localStorage.getItem("theme");
  if(saved) root.setAttribute("data-theme", saved);

  const btn = document.getElementById("themeToggle");
  function syncBtn(){
    const isDark = root.getAttribute("data-theme")==="dark";
    btn.innerHTML = isDark
      ? '<i class="bi bi-sun"></i><span>Light mode</span>'
      : '<i class="bi bi-moon-stars"></i><span>Dark mode</span>';
  }
  syncBtn();

  btn.addEventListener("click", () => {
    const next = root.getAttribute("data-theme")==="dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    syncBtn();
  });
</script>
</body>
</html>
