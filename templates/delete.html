<!DOCTYPE html>
<html>
<head>
    <title>Delete Incident</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f6f9;">

<div class="container mt-5">
    <div class="card shadow p-4 text-center">
        <h3 class="text-danger mb-3">Delete Incident</h3>

        <p>Are you sure you want to delete incident <strong>{{ incident.id }}</strong>?</p>
        <p>Status: {{ incident.status }}</p>

        <form method="POST">
            <button type="submit" class="btn btn-danger px-4">Confirm Delete</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

</body>
</html>
