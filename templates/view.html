<!DOCTYPE html>
<html>
<head>
    <title>View Incident</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f6f9;">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="mb-4 text-center">Incident Details</h3>

        <ul class="list-group">
            <li class="list-group-item"><strong>ID:</strong> {{ incident.id }}</li>
            <li class="list-group-item"><strong>Service:</strong> {{ incident.service }}</li>
            <li class="list-group-item"><strong>Severity:</strong> {{ incident.severity }}</li>
            <li class="list-group-item"><strong>Status:</strong> {{ incident.status }}</li>
            <li class="list-group-item"><strong>Description:</strong> {{ incident.description }}</li>
            <li class="list-group-item"><strong>Created At:</strong> {{ incident.created_at }}</li>
        </ul>

        <div class="mt-4 text-center">
            <a href="{{ url_for('update', iid=incident.id) }}" class="btn btn-warning">Update</a>
            <a href="{{ url_for('delete', iid=incident.id) }}" class="btn btn-danger">Delete</a>
            <a href="/" class="btn btn-secondary">Back</a>
        </div>
    </div>
</div>

</body>
</html>
